version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: buffett_newsletter_db
    environment:
      POSTGRES_USER: newsletter_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: buffett_newsletter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsletter_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: buffett_newsletter_api
    environment:
      FLASK_APP: newsletter_backend.py
      FLASK_ENV: development
      DATABASE_URL: postgresql://newsletter_user:secure_password@postgres:5432/buffett_newsletter
      MAIL_SERVER: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USE_TLS: true
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: sandbox
      BASE_URL: http://localhost:3000
      SECRET_KEY: dev-secret-key-change-in-production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
    command: flask run --host=0.0.0.0

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: buffett_newsletter_ui
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
    command: npm start

  # Redis (optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: buffett_newsletter_cache
    ports:
      - "6379:6379"

volumes:
  postgres_data:

networks:
  default:
    name: buffett_network
